# /etc/nginx/sites-available/bookshelf
#
# Domain: nbookshelf.ddns.net
# After this file is in place, run certbot to get the real certificate:
#   sudo certbot --nginx -d nbookshelf.ddns.net

upstream bookshelf_app {
    # Talk to Gunicorn via the Unix socket (faster than TCP)
    server unix:/run/bookshelf/bookshelf.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name nbookshelf.ddns.net;

    # ── Logging ────────────────────────────────────────────────────────────
    access_log /var/log/nginx/bookshelf_access.log;
    error_log  /var/log/nginx/bookshelf_error.log;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Static files served directly by Nginx (bypass Gunicorn) ────────────
    location /static/ {
        alias /srv/bookshelf/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # ── Everything else goes to Gunicorn ────────────────────────────────────
    location / {
        proxy_pass         http://bookshelf_app;
        proxy_redirect     off;

        # Pass real client info through to Flask
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # Buffer settings (avoids slow-client issues)
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;

        # Max upload size (increase if you add file uploads later)
        client_max_body_size 2M;
    }
}
